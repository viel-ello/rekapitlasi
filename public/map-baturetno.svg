<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" fill="none">
  <!-- Kecamatan Baturetno - Stylized Map with 13 Desa -->
  <defs>
    <pattern id="mapDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#059669" opacity="0.3"/>
    </pattern>
    <pattern id="mapLines" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#059669" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Outer boundary of Kecamatan -->
  <path d="M120 80 L280 30 L420 15 L560 40 L680 100 L720 200 L710 320 L690 420 L650 500 L580 570 L480 620 L370 650 L260 630 L160 570 L100 480 L80 380 L70 260 L90 160 Z" 
    stroke="#059669" stroke-width="2" fill="url(#mapDots)" opacity="0.8"/>

  <!-- Desa boundaries -->
  <!-- Setrorejo -->
  <path d="M120 80 L280 30 L300 120 L220 160 L140 150 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapLines)" opacity="0.6"/>
  <text x="210" y="95" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Setrorejo</text>

  <!-- Kedungombo -->
  <path d="M280 30 L420 15 L450 100 L380 140 L300 120 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="365" y="75" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Kedungombo</text>

  <!-- Boto -->
  <path d="M420 15 L560 40 L580 130 L500 160 L450 100 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapLines)" opacity="0.6"/>
  <text x="500" y="90" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Boto</text>

  <!-- Sendangrejo -->
  <path d="M560 40 L680 100 L670 210 L580 220 L500 160 L580 130 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="600" y="155" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Sendangrejo</text>

  <!-- Talunombo -->
  <path d="M120 80 L140 150 L220 160 L200 240 L120 230 L90 160 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="150" y="200" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Talunombo</text>

  <!-- Baturetno (Capital - larger text, filled) -->
  <path d="M220 160 L300 120 L380 140 L400 230 L350 300 L250 290 L200 240 Z" 
    stroke="#059669" stroke-width="1.5" fill="url(#mapDots)" opacity="0.7"/>
  <text x="300" y="220" text-anchor="middle" fill="#059669" font-size="13" font-weight="bold" font-family="sans-serif" opacity="0.6">Baturetno</text>
  <circle cx="300" cy="235" r="3" fill="#059669" opacity="0.4"/>

  <!-- Saradan -->
  <path d="M380 140 L450 100 L500 160 L580 220 L520 310 L430 290 L400 230 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapLines)" opacity="0.6"/>
  <text x="470" y="220" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Saradan</text>

  <!-- Temon -->
  <path d="M580 220 L670 210 L710 320 L650 370 L560 350 L520 310 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="620" y="295" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Temon</text>

  <!-- Belikurip -->
  <path d="M90 160 L120 230 L200 240 L250 290 L220 370 L130 360 L80 380 L70 260 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapLines)" opacity="0.6"/>
  <text x="155" y="310" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Belikurip</text>

  <!-- Watuagung -->
  <path d="M250 290 L350 300 L430 290 L440 400 L360 430 L270 410 L220 370 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="340" y="365" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Watuagung</text>

  <!-- Balepanjang -->
  <path d="M430 290 L520 310 L560 350 L650 370 L690 420 L650 500 L540 480 L440 400 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapDots)" opacity="0.6"/>
  <text x="560" y="420" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Balepanjang</text>

  <!-- Gambirnom -->
  <path d="M270 410 L360 430 L440 400 L540 480 L480 560 L370 570 L280 530 L220 460 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapLines)" opacity="0.6"/>
  <text x="380" y="495" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Gambirnom</text>

  <!-- Glesungrejo -->
  <path d="M80 380 L130 360 L220 370 L270 410 L220 460 L280 530 L260 630 L160 570 L100 480 Z" 
    stroke="#059669" stroke-width="1" fill="none" opacity="0.6"/>
  <text x="185" y="480" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif" opacity="0.5">Glesungrejo</text>

  <!-- South continuation -->
  <path d="M280 530 L370 570 L480 560 L580 570 L480 620 L370 650 L260 630 Z" 
    stroke="#059669" stroke-width="1" fill="url(#mapDots)" opacity="0.5"/>

  <!-- Compass Rose -->
  <g transform="translate(680, 600)" opacity="0.4">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#059669" stroke-width="1"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#059669" stroke-width="1"/>
    <polygon points="0,-22 -4,-12 4,-12" fill="#059669"/>
    <text x="0" y="-26" text-anchor="middle" fill="#059669" font-size="9" font-family="monospace">U</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(60, 660)" opacity="0.3">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#059669" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#059669" stroke-width="1"/>
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#059669" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" fill="#059669" font-size="8" font-family="monospace">~5 km</text>
  </g>

  <!-- Title -->
  <text x="400" y="685" text-anchor="middle" fill="#059669" font-size="12" font-family="monospace" letter-spacing="3" opacity="0.3">KECAMATAN BATURETNO</text>
</svg>
